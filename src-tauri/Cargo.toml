[package]
name = "workbuddy-theme-switcher"
version = "1.6.2"
description = "A lightweight local switcher for verified WorkBuddy CodeDrobe themes"
authors = ["WorkBuddy Theme Switcher"]
edition = "2021"
license = "MIT"

[lib]
name = "workbuddy_theme_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "workbuddy-theme-switcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
